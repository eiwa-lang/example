name: quotes
steps:
  - goto:
      url: https://quotes.toscrape.com/
  - collect:
      selector: div.quote
      fields:
        - name: text
          selector: span.text
        - name: author
          selector: small.author
        - name: tags
          selector: a.tag
          many: true
  - paginate:
      selector: li.next a
      maxPages: 100
required:
  - text
  - author
