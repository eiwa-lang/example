name: eiwa-mcp
steps:
  - goto:
      url: https://eiwa.dev/
      timeoutMs: 30000
  - wait:
      selector: "#example-view h3"
      timeoutMs: 6000
      text: HTTP
  - click:
      selector: "//button[contains(@class, 'example-tab')]"
      index: 6
  - wait:
      selector: "#example-view h3"
      timeoutMs: 1000
      text: MCP
  - collect:
      fields:
        - name: title
          selector: "#example-view h3"
        - name: lede
          selector: "#example-view p"
        - name: snippets
          selector: "#example-view pre"
          many: true
required:
  - title
