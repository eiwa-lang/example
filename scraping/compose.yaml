# Scraping service stack (Phase 0).
#
# Versions are pinned; bump by explicit decision only. The worker
# image has no release tag yet, so Phase 0 builds it from the local
# browser checkout (build section below) instead of referencing a
# dev tag. Switch `image:` to a released tag once one exists.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraping
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraping"]
      interval: 5s
      retries: 12
    ports:
      - "5435:5432"

  browser-worker:
    build:
      context: ../../browser
      dockerfile: Dockerfile
      args:
        EIWA_VERSION: v0.0.79
    ports:
      - "127.0.0.1:18080:8080"

  scraper:
    build:
      context: .
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      BROWSER_WORKERS: ws://browser-worker:8080
      DATABASE_URL: postgres://scraper:scraper@postgres:5432/scraping
      CONCURRENCY: 4
      POLL_INTERVAL_MS: 1000
      ARTIFACT_DIR: /var/lib/scraper/artifacts
      PIPELINES_DIR: /pipelines
      CAPTCHA_PROVIDERS: ${CAPTCHA_PROVIDERS:-}
      SOLVER_URL: http://captcha-solver:8855
      SOLVER_KEY: ${SOLVER_KEY:-}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-}
    volumes:
      - artifacts:/var/lib/scraper/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  # LOCAL ONLY (uncommitted experiment): self-hosted captcha solver stack
  # for live proofs. Opt-in via profile so default `up` is unaffected:
  #   docker compose --profile captcha up -d captcha-solver
  # Build contexts are absolute /tmp clones on purpose — final placement
  # (vendored dir vs git-URL contexts) is still an open decision.
  captcha-recaptcha:
    profiles: [captcha]
    build:
      context: /tmp/captchasolver/recaptcha
    ports:
      - "127.0.0.1:8866:8866"
    environment:
      SOLVER_API_KEY: local-dev-key-001
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8866/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20

  captcha-solver:
    profiles: [captcha]
    build:
      context: /tmp/captchasolver/universal
      dockerfile: Dockerfile.local
    ports:
      - "127.0.0.1:8855:8855"
    environment:
      SOLVER_API_KEY: local-dev-key-001
      RECAPTCHA_SOLVER_URL: http://captcha-recaptcha:8866
    depends_on:
      captcha-recaptcha:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8855/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  artifacts:
