# Namespaces
apiVersion: v1
kind: Namespace
metadata:
  name: eiwa
  labels:
    name: eiwa
    environment: production
---
# Deployment Eiwa home
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eiwa-home
  namespace: eiwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eiwa-home
  template:
    metadata:
      labels:
        app: eiwa-home
    spec:
      containers:
        - name: eiwa-home
          image: leodouglas/eiwa-home:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
---
# Service Eiwa home
apiVersion: v1
kind: Service
metadata:
  name: eiwa-home
  namespace: eiwa
spec:
  selector:
    app: eiwa-home
  ports:
  - port: 8081
    targetPort: 8081
---
# Ingress Eiwa
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: eiwa-ingressroute
  namespace: eiwa
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`eiwa.dev`)
      kind: Rule
      services:
        - name: eiwa-home
          port: 8081
